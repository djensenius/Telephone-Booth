# Raspberry Pi "personal tools" mise config.
#
# This file has NOTHING to do with the Telephone Booth application itself —
# it is a convenience manifest for provisioning the maintainer's preferred
# command-line tools on a Raspberry Pi when a distro apt package is missing
# or too old.
#
# ARCHITECTURE: this manifest targets 64-bit Raspberry Pi OS (arm64) only.
# neovim, tmux, atuin, zellij, and herdr publish aarch64 Linux binaries but
# no 32-bit ARM ones, so `mise install` will fail on armhf. On 32-bit Pi OS
# use apt for those tools instead — see docs/raspberry-pi-tools.md.
#
# Usage on the Pi:
#
#   mkdir -p ~/.config/mise
#   cp packaging/raspberry-pi/mise.toml ~/.config/mise/config.toml
#   mise trust ~/.config/mise/config.toml
#   mise install
#
# mise itself is best installed from its own apt repo first — see
# docs/raspberry-pi-tools.md. Everything below downloads a prebuilt binary
# for your architecture (no compiling).

[tools]
# Keep these on latest releases via mise (Debian apt can lag behind).
# `fish` is not in the mise registry — install it with apt.
tmux = "latest"
bat = "latest"

# Tools with no good Raspberry Pi apt package — mise manages these.
neovim = "latest"
starship = "latest"
atuin = "latest"
zellij = "latest"
bottom = "latest"   # provides the `btm` binary
delta = "latest"    # git-delta
herdr = "latest"    # agent multiplexer for the terminal

# eza also has apt routes (Pi OS 13+ ships it; deb.gierens.de covers older
# releases and armhf). mise tracks upstream more closely on arm64 — comment
# this out and use apt if you would rather not manage it here.
eza = "latest"
