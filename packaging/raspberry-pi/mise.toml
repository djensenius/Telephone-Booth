# Raspberry Pi "personal tools" mise config.
#
# This file has NOTHING to do with the Telephone Booth application itself —
# it is a convenience manifest for provisioning the maintainer's preferred
# command-line tools on a Raspberry Pi (arm64 / armhf) when a distro apt
# package is missing or too old.
#
# Usage on the Pi:
#
#   mkdir -p ~/.config/mise
#   cp packaging/raspberry-pi/mise.toml ~/.config/mise/config.toml
#   mise trust ~/.config/mise/config.toml
#   mise install
#
# mise itself is best installed from its own apt repo first — see
# docs/raspberry-pi-tools.md. Everything below downloads a prebuilt binary
# for your architecture (no compiling) unless noted.

[tools]
# Tools with no good Raspberry Pi apt package — mise manages these.
neovim = "latest"
starship = "latest"
atuin = "latest"
zellij = "latest"
bottom = "latest"   # provides the `btm` binary
delta = "latest"    # git-delta

# herdr publishes prebuilt release binaries on GitHub; fetch them with the
# `ubi` backend (no Rust toolchain / compile step required).
"ubi:ogulcancelik/herdr" = "latest"

# The following also have first-class apt packages on Raspberry Pi OS and are
# usually better installed with apt (see docs/raspberry-pi-tools.md). Uncomment
# them here if you would rather manage everything through mise instead.
# bat = "latest"     # apt package installs the binary as `batcat`
# eza = "latest"     # apt repo: deb.gierens.de
