# Raspberry Pi "personal tools" mise config.
#
# This file has NOTHING to do with the Telephone Booth application itself —
# it is a convenience manifest for provisioning the maintainer's preferred
# command-line tools on a Raspberry Pi.
#
# Targets 64-bit Raspberry Pi OS (arm64), which is what docs/raspberry-pi-setup.md
# provisions. neovim, tmux, atuin, zellij, eza, and herdr resolve aarch64 Linux
# binaries only, so on a 32-bit armhf install use apt instead — see
# docs/raspberry-pi-tools.md.
#
# Usage on the Pi:
#
#   mkdir -p ~/.config/mise
#   cp packaging/raspberry-pi/mise.toml ~/.config/mise/config.toml
#   mise trust ~/.config/mise/config.toml
#   mise install
#
# mise itself is best installed from its own apt repo first — see
# docs/raspberry-pi-tools.md. Everything below downloads a prebuilt binary
# (no compiling).
#
# `fish` is absent on purpose: it has no mise registry entry. Install it with
# `sudo apt install fish`.

[tools]
tmux = "latest"
bat = "latest"
eza = "latest"
neovim = "latest"
starship = "latest"
atuin = "latest"
zellij = "latest"
bottom = "latest"   # provides the `btm` binary
delta = "latest"    # git-delta
herdr = "latest"    # agent multiplexer for the terminal
